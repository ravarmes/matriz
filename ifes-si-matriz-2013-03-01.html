<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matriz Atual – SI (01/03/2013)</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --muted: #666;
            --border: #ddd;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 20px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 12px 28px;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(150px, 1fr));
            gap: 12px;
        }

        .period {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .period-header {
            padding: 10px 12px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
            text-align: center;
        }

        .discipline-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-meta {
            color: var(--muted);
            font-size: 11px;
        }

        /* Cores por categoria (reutilizando classes existentes) */
        .complementares { background-color: #DDA0DD; }
        .matematica { background-color: #A3D977; }
        .desenvolvimento { background-color: #FFEB3B; }
        .informaticaOutras { background-color: #FFB656; }
        .redes { background-color: #38a2dc; }

        .legend {
            margin-top: 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border: 1px solid #333;
            border-radius: 3px;
            display: inline-block;
        }
    </style>
</head>
<body>

            { id: 44, nome: "Optativa 3", cargaHoraria: "30h", left: 1262.5, top: 455, tipo: "informaticaOutras", periodo: 8 }

        function buildGrid() {
            const grid = document.getElementById('grid');
            const periods = Array.from({ length: 8 }, (_, i) => i + 1);

            periods.forEach(periodo => {
                const periodEl = document.createElement('div');
                periodEl.className = 'period';

                const headerEl = document.createElement('div');
                headerEl.className = 'period-header';
                headerEl.textContent = `${periodo}º Período`;
                periodEl.appendChild(headerEl);

                const listEl = document.createElement('div');
                listEl.className = 'discipline-list';

                const items = disciplinas
                    .filter(d => d.periodo === periodo)
                    .sort((a, b) => a.top - b.top); // usa a ordem aproximada do layout

                items.forEach(d => {
                    const card = document.createElement('div');
                    card.className = `card ${d.tipo}`;

                    const title = document.createElement('div');
                    title.className = 'card-title';
                    title.textContent = d.nome;

                    const meta = document.createElement('div');
                    meta.className = 'card-meta';
                    meta.textContent = `CH: ${d.cargaHoraria}`;

                    card.appendChild(title);
                    card.appendChild(meta);
                    listEl.appendChild(card);
                });

                periodEl.appendChild(listEl);
                grid.appendChild(periodEl);
            });
        }

        function buildLegend() {
            const legend = document.getElementById('legend');
            Object.entries(categories).forEach(([key, cfg]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';

                const color = document.createElement('span');
                color.className = 'legend-color';
                color.style.backgroundColor = cfg.color;

                const label = document.createElement('span');
                label.textContent = cfg.name;

                item.appendChild(color);
                item.appendChild(label);
                legend.appendChild(item);
            });
        }

        buildGrid();
        buildLegend();
    </script>
</body>
</html>
